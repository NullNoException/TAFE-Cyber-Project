# =============================================================================
# CYBERLAB SECURITY INFRASTRUCTURE - UPDATED
# Complete Docker Compose IaC Definition with All Services Enabled
# =============================================================================
#
# Network Architecture:
#   - External Network (10.10.0.0/24)  : VPN/Remote Access Entry Point
#   - DMZ Network (10.10.10.0/24)      : Public-Facing Services
#   - Internal Network (10.10.20.0/24) : Protected Services & Data
#   - Security Network (10.10.30.0/24) : Monitoring & Analysis (ISOLATED)
#   - Management Network (10.10.40.0/24): Admin Interfaces
#
# =============================================================================

networks:
  # External network for VPN access
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

  # DMZ network for public-facing services
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

  # Internal network for protected services
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1

  # Security network (isolated) for monitoring and analysis
  security_net:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1

  # Management network for administration interfaces
  management_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.40.0/24
          gateway: 10.10.40.1

# =============================================================================
# SECRETS
# =============================================================================

secrets:
  postgres_password:
    file: ./secrets/postgres_password

# =============================================================================
# SERVICES
# =============================================================================

services:
  # ===========================================================================
  # EXTERNAL/SECURITY LAYER
  # ===========================================================================
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy & Load Balancer (ENABLED)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: traefik
    hostname: traefik
    networks:
      external_net:
        ipv4_address: 10.10.0.5
      dmz_net:
        ipv4_address: 10.10.10.5
      internal_net:
        ipv4_address: 10.10.20.5
      security_net:
        ipv4_address: 10.10.30.5
      management_net:
        ipv4_address: 10.10.40.5
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"
    environment:
      - TZ=UTC
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/traefik.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --log.level=INFO
      # Prometheus metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.buckets=0.01,0.05,0.1,0.25,0.5,1,2.5,5,10
      # OTLP Tracing (HTTP endpoint for OpenTelemetry Collector)
      - --tracing.otlp.http=true
      - --tracing.otlp.http.endpoint=http://10.10.30.30:4318
      - --tracing.otlp.samplerate=1.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs/services/traefik-cert.pem:/certs/traefik-cert.pem:ro
      - ./certs/services/traefik-key.pem:/certs/traefik-key.pem:ro
      - ./certs/ca/ca-cert.pem:/certs/ca-cert.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/etc/traefik/certs/root-ca.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/etc/traefik/certs/wazuh.dashboard.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/etc/traefik/certs/wazuh.dashboard-key.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/traefik/certs/wazuh.manager.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/traefik/certs/wazuh.manager-key.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/etc/traefik/certs/wazuh.indexer.pem:ro
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/etc/traefik/certs/wazuh.indexer-key.pem:ro
      - traefik_logs:/var/log/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.cyberlab.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "traefik"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - neuvector-allinone
      - dns-server
    restart: unless-stopped
    # Traefik Dashboard routed via dynamic.yml (admin-only-access middleware)

  # ---------------------------------------------------------------------------
  # NeuVector All-in-One - Container Security Platform
  # ---------------------------------------------------------------------------
  neuvector-allinone:
    image: neuvector/allinone:5.4.7
    container_name: neuvector-allinone
    hostname: neuvector-allinone
    privileged: true
    pid: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
      - IPC_LOCK
      - SYS_NICE
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
      - label=disable
    networks:
      security_net:
        ipv4_address: 10.10.30.11
      management_net:
        ipv4_address: 10.10.40.11
    environment:
      - CLUSTER_JOIN_ADDR=10.10.30.11
      - CTRL_SERVER_IP=127.0.0.1
      - NV_PLATFORM_INFO=platform=Docker
      - NV_LOG_LEVEL=info
      - NV_INTERNAL_CERT_VERIFY=false
      - TZ=UTC
    ports:
      - "8443:8443"
      - "10443:10443"
      - "18300:18300"
      - "18301:18301"
      - "18400:18400"
      - "18401:18401"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - neuvector_data:/var/neuvector
      - ./configs/neuvector/certs/internal:/etc/neuvector/certs/internal
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "neuvector"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenVPN - VPN Gateway
  # ---------------------------------------------------------------------------
  openvpn:
    image: openvpn/openvpn-as:latest
    container_name: openvpn
    hostname: openvpn
    privileged: false
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      external_net:
        ipv4_address: 10.10.0.20
      internal_net:
        ipv4_address: 10.10.20.201
      security_net:
        ipv4_address: 10.10.30.201
      management_net:
        ipv4_address: 10.10.40.201
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "1194:1194/udp" # VPN Protocol (direct access)
      - "1194:443/tcp" # VPN Protocol (TCP fallback)
    volumes:
      - openvpn_data:/openvpn
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "openvpn"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    depends_on:
      - neuvector-allinone
    # Traefik routing configured in configs/traefik/dynamic.yml

  # ---------------------------------------------------------------------------
  # MariaDB - Database for Daloradius
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    hostname: mariadb
    networks:
      internal_net:
        ipv4_address: 10.10.20.46
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword123
      - MARIADB_DATABASE=radius
      - MARIADB_USER=radius
      - MARIADB_PASSWORD=radiuspassword123
      - TZ=UTC
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Daloradius - RADIUS Server + Web UI
  # ---------------------------------------------------------------------------
  daloradius:
    image: asdaru/freeradius-mysql-daloradius:nomysql
    platform: linux/amd64
    container_name: daloradius
    hostname: daloradius
    networks:
      internal_net:
        ipv4_address: 10.10.20.45
      security_net:
        ipv4_address: 10.10.30.45
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_PORT=3306
      - MYSQL_USER=radius
      - MYSQL_PASSWORD=radiuspassword123
      - MYSQL_DATABASE=radius
      - TZ=UTC
    # ports:
    #   - "1812:1812/udp"
    #   - "1813:1813/udp"
    depends_on:
      - mariadb
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

  # ===========================================================================
  # DMZ LAYER - PUBLIC FACING SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # DNS Server - BIND9 DNS for cyberlab.local Domain
  # ---------------------------------------------------------------------------
  dns-server:
    image: ubuntu/bind9:latest
    container_name: dns-server
    hostname: dns-server
    networks:
      security_net:
        ipv4_address: 10.10.30.101
      management_net:
        ipv4_address: 10.10.40.101
      internal_net:
        ipv4_address: 10.10.20.251
    # ports:
    #   - "53:53/tcp"
    #   - "53:53/udp"
    environment:
      - TZ=UTC
    volumes:
      # BIND configuration
      - ./configs/bind/named.conf:/etc/bind/named.conf:ro
      # Zone files
      - ./configs/bind/db.cyberlab.local:/etc/bind/zones/db.cyberlab.local:ro
      - ./configs/bind/db.10.10.0.rev:/etc/bind/zones/db.10.10.0.rev:ro
      - ./configs/bind/db.10.10.10.rev:/etc/bind/zones/db.10.10.10.rev:ro
      - ./configs/bind/db.10.10.20.rev:/etc/bind/zones/db.10.10.20.rev:ro
      - ./configs/bind/db.10.10.30.rev:/etc/bind/zones/db.10.10.30.rev:ro
      - ./configs/bind/db.10.10.40.rev:/etc/bind/zones/db.10.10.40.rev:ro
      # Cache and logs
      - dns_cache:/var/cache/bind
      - dns_logs:/var/log/bind
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.15"
          memory: 128M
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "cyberlab.local", "SOA"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "dns-server"
        syslog-format: "rfc5424"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx - Web Server (Behind Traefik)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    hostname: nginx
    networks:
      dmz_net:
        ipv4_address: 10.10.10.10
      internal_net:
        ipv4_address: 10.10.20.10
    dns:
      - 10.10.30.101
      - 10.10.20.251
    environment:
      - TZ=UTC
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/conf.d:/etc/nginx/conf.d:ro
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "nginx"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - traefik
      - wazuh.manager
      - neuvector-allinone
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (nginx router)

  # ===========================================================================
  # INTERNAL NETWORK - PROTECTED SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # PostgreSQL - Multi-tenant Database Server
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:15-alpine
    container_name: postgresql
    hostname: postgresql
    networks:
      internal_net:
        ipv4_address: 10.10.20.30
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-SecureP@ssw0rd}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "postgresql"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    depends_on:
      - wazuh.manager
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # OpenLDAP - Directory Service (ENABLED & FIXED)
  # ---------------------------------------------------------------------------
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    hostname: openldap
    networks:
      internal_net:
        ipv4_address: 10.10.20.40
      security_net:
        ipv4_address: 10.10.30.40
      management_net:
        ipv4_address: 10.10.40.40
    environment:
      - LDAP_ORGANISATION=${LDAP_ORGANISATION:-CyberLab}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-cyberlab.local}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-dc=cyberlab,dc=local}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD:-admin}
      - LDAP_CONFIG_PASSWORD=${LDAP_CONFIG_PASSWORD:-config}
      - LDAP_TLS=true
      - LDAP_TLS_VERIFY_CLIENT=try
      - LDAP_LOG_LEVEL=stats
      - TZ=UTC
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_slapd:/etc/ldap/slapd.d
      - ./configs/ldap/ldif:/ldif:ro
      - openldap_logs:/var/log/slapd
    # ports:
    #   - "389:389"
    #   - "636:636"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "openldap"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    entrypoint: sh -c "(apt-get update && apt-get install -y dnsutils > /dev/null 2>&1 &) && exec /container/tool/run"

  # ---------------------------------------------------------------------------
  # phpLDAPadmin - LDAP Web Management Interface (ENABLED - FIXED)
  # ---------------------------------------------------------------------------
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    networks:
      internal_net:
        ipv4_address: 10.10.20.41
      security_net:
        ipv4_address: 10.10.30.41
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_LDAP_BIND_ID=cn=admin,dc=cyberlab,dc=local
      - PHPLDAPADMIN_HTTPS=false
      - TZ=UTC
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "phpldapadmin"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    depends_on:
      - openldap
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (phpldapadmin router)

  # ---------------------------------------------------------------------------
  # MongoDB - Document Database (For Rocket.Chat)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:5
    container_name: mongodb
    hostname: mongodb
    networks:
      internal_net:
        ipv4_address: 10.10.20.51
    environment:
      - TZ=UTC
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongodb-rs.sh:/usr/local/bin/init-mongodb-rs.sh:ro
    entrypoint: /bin/bash
    command: /usr/local/bin/init-mongodb-rs.sh
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "mongodb"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 1G
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Workstation - GUI Desktop for Client Access (VPN Gateway)
  # ---------------------------------------------------------------------------
  workstation:
    image: dorowu/ubuntu-desktop-lxde-vnc:latest
    container_name: workstation
    hostname: workstation
    cap_add:
      - NET_ADMIN
    networks:
      internal_net:
        ipv4_address: 10.10.20.100
      dmz_net:
        ipv4_address: 10.10.10.100
      security_net:
        ipv4_address: 10.10.30.100
      management_net:
        ipv4_address: 10.10.40.100
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    extra_hosts:
      - "traefik.cyberlab.local:10.10.20.5"
      - "chat.cyberlab.local:10.10.20.5"
      - "grafana.cyberlab.local:10.10.20.5"
      - "prometheus.cyberlab.local:10.10.20.5"
      - "wazuh.cyberlab.local:10.10.20.5"
    environment:
      - VNC_PASSWORD=cyberlab123
      - TZ=UTC
    # ports:
    #   - "6080:80" # VNC Web UI (noVNC)
    #   - "5900:5900" # VNC Port
    volumes:
      - ./configs/ldap/ldif:/home/ubuntu/ldap-configs:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    # NOTE: Access controlled via Traefik dynamic.yml (internal-net-access middleware)

  # ---------------------------------------------------------------------------
  # PostgreSQL - Database for Mattermost
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    networks:
      internal_net:
        ipv4_address: 10.10.20.52
    environment:
      - POSTGRES_DB=mattermost
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Mattermost - Team Communication Platform
  # ---------------------------------------------------------------------------
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    hostname: mattermost
    networks:
      dmz_net:
        ipv4_address: 10.10.10.53
      internal_net:
        ipv4_address: 10.10.20.53
      security_net:
        ipv4_address: 10.10.30.53
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    extra_hosts:
      - "mattermost.cyberlab.local:10.10.20.53"
      - "chat.cyberlab.local:10.10.20.5"
      - "postgres.cyberlab.local:10.10.20.51"
      - "traefik.cyberlab.local:10.10.20.5"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:Mattermost20250SecurePassword@postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=https://chat.cyberlab.local
      - MM_TEAMSETTINGS_SITENAME=CyberLab
      - MM_SERVICESETTINGS_LISTENADDRESS=0.0.0.0:8065
      - MM_LOGSETTINGS_CONSOLELEVEL=info
      - MM_FILESETTINGS_PUBLICLINKSALT=K8mX9pQrL2vN5sT4wY7uJ3hG6fD1bC8eZ0aS5kP2
      - MM_TEAMSETTINGS_MAXUSERSPERTEAM=100
      - MM_SERVICESETTINGS_ENABLEOAUTH=true
      - MM_SERVICESETTINGS_ENABLEOPENSERVER=true
      - MM_PASSWORDSETTINGS_MINIMUMLENGTH=8
      - MM_PASSWORDSETTINGS_LOWERCASE=true
      - MM_PASSWORDSETTINGS_NUMBER=true
      - MM_PASSWORDSETTINGS_UPPERCASE=true
      - TZ=UTC
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "mattermost"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mattermost.rule=Host(`chat.cyberlab.local`)"
      - "traefik.http.routers.mattermost.entrypoints=websecure"
      - "traefik.http.routers.mattermost.tls=true"
      - "traefik.http.services.mattermost.loadbalancer.server.port=8065"
    # NOTE: Full routing configured via Traefik dynamic.yml (mattermost router)

  # ===========================================================================
  # SECURITY NETWORK - MONITORING & ANALYSIS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Wazuh Indexer - OpenSearch (Elasticsearch Fork)
  # ---------------------------------------------------------------------------
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.1
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    security_opt:
      - seccomp=unconfined
    networks:
      security_net:
        ipv4_address: 10.10.30.10
      management_net:
        ipv4_address: 10.10.40.10
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    # NOTE: Access controlled via Traefik dynamic.yml (security-net-access middleware)
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - TZ=UTC
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./configs/wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./configs/wazuh/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./configs/wazuh/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "wazuh.indexer"
    mem_limit: 2g
    cpus: 1.0

  # ---------------------------------------------------------------------------
  # Wazuh Manager - SIEM Central Manager
  # ---------------------------------------------------------------------------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.1
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    networks:
      security_net:
        ipv4_address: 10.10.30.20
      internal_net:
        ipv4_address: 10.10.20.60
      dmz_net:
        ipv4_address: 10.10.10.60
      management_net:
        ipv4_address: 10.10.40.20
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    # NOTE: Access controlled via Traefik dynamic.yml (security-net-access middleware)
    # ports:
    #   - "514:514/udp"
    #   - "1514:1514"
    #   - "1515:1515"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
      - TZ=UTC
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      # - wazuh_var_multigroups:/var/ossec/var/multigroups  # Removed due to init failure
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./configs/wazuh/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./configs/wazuh/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Suricata integration - rules mounted to container
      # Decoders disabled due to format incompatibility - using native Wazuh JSON parsing
      - ./configs/wazuh/suricata_rules.xml:/var/ossec/etc/rules/suricata_rules.xml:ro
      # - ./configs/wazuh/custom_detection_rules.xml:/var/ossec/etc/rules/custom_detection_rules.xml:ro
      # Share Suricata logs volume for log monitoring
      - suricata_logs:/var/log/suricata:ro
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "wazuh.manager"
    depends_on:
      - wazuh.indexer
    mem_limit: 2g
    cpus: 1.0

  # ---------------------------------------------------------------------------
  # Wazuh Dashboard - Web Interface
  # ---------------------------------------------------------------------------
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.1
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    networks:
      security_net:
        ipv4_address: 10.10.30.21
      management_net:
        ipv4_address: 10.10.40.21
    dns:
      - 10.10.30.101
      - 10.10.20.251
      - 10.10.40.101
    extra_hosts:
      - "wazuh.indexer:10.10.30.10"
      - "wazuh.manager:10.10.30.20"
    # NOTE: Access controlled via Traefik dynamic.yml (security-net-access middleware)
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
      - TZ=UTC
    volumes:
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./configs/wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./configs/wazuh/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./configs/wazuh/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "wazuh.dashboard"
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    mem_limit: 1g
    cpus: 0.5

  # ---------------------------------------------------------------------------
  # Suricata - Network IDS/IPS (ENABLED & FIXED)
  # ---------------------------------------------------------------------------
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    hostname: suricata
    networks:
      dmz_net:
        ipv4_address: 10.10.10.70
      security_net:
        ipv4_address: 10.10.30.70
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - NET_BIND_SERVICE
    privileged: false
    volumes:
      - suricata_logs:/var/log/suricata
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./configs/suricata/suricata.rules:/var/lib/suricata/suricata.rules
    environment:
      - TZ=UTC
      - SURICATA_HOME=/var/lib/suricata
    # Suricata IDS mode monitoring all interfaces from suricata.yaml (eth0, eth1)
    command: -c /etc/suricata/suricata.yaml --af-packet
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "suricata"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped
    depends_on:
      - wazuh.manager
    # NOTE: Access controlled via Traefik dynamic.yml (security-net-access middleware)

  # ===========================================================================
  # HONEYPOT SERVICES - SECURITY DETECTION & ANALYSIS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Cowrie SSH/Telnet Honeypot - Brute-Force & Malware Detection
  # ---------------------------------------------------------------------------
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    hostname: cowrie
    networks:
      internal_net:
        ipv4_address: 10.10.20.72
      security_net:
        ipv4_address: 10.10.30.72
    environment:
      - TZ=UTC
      - COWRIE_HOSTNAME=prodserver01
    ports: []
    volumes:
      # Configuration
      - ./configs/honeypot/cowrie.cfg:/cowrie/etc/cowrie.cfg:ro
      # Logs
      - ./honeypot_logs/cowrie:/var/log/cowrie
      # Downloads/Payloads
      - ./honeypot_logs/cowrie_downloads:/cowrie/downloads
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "cowrie"
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "2222"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dionaea Multi-Protocol Honeypot - Windows Service Simulation
  # ---------------------------------------------------------------------------
  dionaea:
    image: dinotools/dionaea:latest
    container_name: dionaea
    hostname: dionaea
    networks:
      internal_net:
        ipv4_address: 10.10.20.71
      security_net:
        ipv4_address: 10.10.30.71
    environment:
      - TZ=UTC
      - DIONAEA_NAME=dionaea-01
    ports: []
    volumes:
      # Configuration
      - ./configs/honeypot/dionaea.cfg:/etc/dionaea/dionaea.cfg:ro
      # Logs
      - ./honeypot_logs/dionaea:/var/log/dionaea
      # Downloads/Payloads
      - ./honeypot_logs/dionaea_downloads:/dionaea/downloads
      # Incidents
      - ./honeypot_logs/dionaea_incidents:/dionaea/incidents
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "dionaea"
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  # ===========================================================================
  # WEB APPLICATION HONEYPOTS - OWASP VULNERABLE APPS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # OWASP Juice Shop - Intentionally Vulnerable Web Application
  # ---------------------------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    hostname: juice-shop
    networks:
      internal_net:
        ipv4_address: 10.10.20.80
      security_net:
        ipv4_address: 10.10.30.80
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=UTC
      - LOG_LEVEL=info
    ports: []
    volumes:
      - juice_shop_data:/juice-shop/data
      - juice_shop_logs:/juice-shop/logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "juice-shop"
        syslog-facility: "16"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - wazuh.manager
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.juice-shop.rule=Host(`juice-shop.cyberlab.local`)"
      - "traefik.http.routers.juice-shop.entrypoints=websecure"
      - "traefik.http.routers.juice-shop.tls=true"
      - "traefik.http.services.juice-shop-svc.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # OWASP WebGoat - Web Application Security Training
  # ---------------------------------------------------------------------------
  webgoat:
    image: webgoat/goatandwolf:latest
    container_name: webgoat
    hostname: webgoat
    networks:
      internal_net:
        ipv4_address: 10.10.20.81
      security_net:
        ipv4_address: 10.10.30.81
    environment:
      - PORT=8080
      - TZ=UTC
      - GOATANDWOLF_VERBOSE=true
    ports: []
    volumes:
      - webgoat_data:/usr/local/tomcat/webapps/WebGoat/data
      - webgoat_logs:/usr/local/tomcat/logs
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "webgoat"
        syslog-facility: "16"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/WebGoat/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - wazuh.manager
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webgoat.rule=Host(`webgoat.cyberlab.local`)"
      - "traefik.http.routers.webgoat.entrypoints=websecure"
      - "traefik.http.routers.webgoat.tls=true"
      - "traefik.http.services.webgoat-svc.loadbalancer.server.port=8080"

  # ===========================================================================
  # BACKUP SERVICE
  # ===========================================================================
  # MONITORING & OBSERVABILITY - GRAFANA & PROMETHEUS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection & Storage
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    networks:
      security_net:
        ipv4_address: 10.10.30.50
    environment:
      - TZ=UTC
    # ports:
    #   - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=https://prometheus.cyberlab.local"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./configs/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "prometheus"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (prometheus router)

  # ---------------------------------------------------------------------------
  # Grafana - Visualization & Dashboarding
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    hostname: grafana
    networks:
      internal_net:
        ipv4_address: 10.10.20.61
      security_net:
        ipv4_address: 10.10.30.60
      management_net:
        ipv4_address: 10.10.40.60
    # ports:
    #   - "3000:3000"
    environment:
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_ROOT_URL=https://grafana.cyberlab.local
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=SecureG@fana1
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_X_FORWARDED_PROTO=https
      - TZ=UTC
    volumes:
      - ./configs/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_storage:/var/lib/grafana
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "grafana"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    depends_on:
      - prometheus
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (grafana router)

  # ===========================================================================
  # PACKET CAPTURE & NETWORK ANALYSIS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # TCPDump PCAP Collector - Lightweight packet capture for all networks
  # Captures all traffic and stores PCAP files for analysis
  # ---------------------------------------------------------------------------
  tcpdump-collector:
    image: nicolaka/netshoot:latest
    container_name: tcpdump-collector
    hostname: tcpdump-collector
    networks:
      security_net:
        ipv4_address: 10.10.30.91
      management_net:
        ipv4_address: 10.10.40.91
      dmz_net:
        ipv4_address: 10.10.10.91
      internal_net:
        ipv4_address: 10.10.20.91
      external_net:
        ipv4_address: 10.10.0.91
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    environment:
      - TZ=UTC
    volumes:
      - packet_capture_pcap:/pcap
      - ./configs/tcpdump/tcpdump.sh:/usr/local/bin/start-capture.sh:ro
    entrypoint: /bin/sh
    command: /usr/local/bin/start-capture.sh
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "tcpdump-collector"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Wireshark Web UI - Packet analysis interface
  # Analyze captured PCAP files with web-based Wireshark
  # ---------------------------------------------------------------------------
  wireshark-ui:
    image: linuxserver/wireshark:latest
    container_name: wireshark-ui
    hostname: wireshark-ui
    networks:
      security_net:
        ipv4_address: 10.10.30.92
      management_net:
        ipv4_address: 10.10.40.92
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "3001:3000"
    environment:
      - TZ=UTC
      - PUID=1000
      - PGID=1000
      - GUACD_LOG_LEVEL=info
    volumes:
      - packet_capture_pcap:/pcap:ro
      - wireshark_config:/config
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "wireshark-ui"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    depends_on:
      - tcpdump-collector
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (wireshark router)

  # ---------------------------------------------------------------------------
  # Netdata - Real-time System & Network Monitoring Web UI
  # Provides beautiful real-time dashboards for all infrastructure metrics
  # ---------------------------------------------------------------------------
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: netdata
    networks:
      security_net:
        ipv4_address: 10.10.30.93
      management_net:
        ipv4_address: 10.10.40.93
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - TZ=UTC
      - PGID=0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/netdata:/etc/netdata
      - netdata_cache:/var/cache/netdata
      - netdata_lib:/var/lib/netdata
    # ports:
    #   - "19999:19999"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "netdata"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    depends_on:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (netdata router)

  # ---------------------------------------------------------------------------
  # Influx DB - Time Series Database for Extended Metrics Storage
  # Backend storage for long-term metrics retention
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:2-alpine
    container_name: influxdb
    hostname: influxdb
    networks:
      security_net:
        ipv4_address: 10.10.30.94
    environment:
      - TZ=UTC
      - INFLUXDB_DB=cyberlab_metrics
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD:-InfluxPassword2025!}
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.10.30.20:514"
        tag: "influxdb"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    depends_on:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    # NOTE: Routing configured via Traefik dynamic.yml (influxdb router)

  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Backup Service - Complete System Backup
  # ---------------------------------------------------------------------------
  backup:
    image: alpine:latest
    container_name: backup
    hostname: backup
    networks:
      internal_net:
        ipv4_address: 10.10.20.200
      security_net:
        ipv4_address: 10.10.30.200
      management_net:
        ipv4_address: 10.10.40.200
    environment:
      - TZ=UTC
      - BACKUP_SCHEDULE=0 2 * * *
      - BACKUP_RETENTION_DAYS=30
    volumes:
      # Mount all volumes for backup
      - wazuh-indexer-data:/backup/wazuh-indexer:ro
      - wazuh_api_configuration:/backup/wazuh-api:ro
      - wazuh_etc:/backup/wazuh-etc:ro
      - wazuh_logs:/backup/wazuh-logs:ro
      - openldap_data:/backup/ldap-data:ro
      - openldap_slapd:/backup/ldap-config:ro
      - mongodb_data:/backup/mongodb:ro
      - postgres_data:/backup/postgres:ro
      - mattermost_data:/backup/mattermost:ro
      # Mount configuration directory
      - ./configs:/backup/configs:ro
      # Backup storage
      - backup_storage:/backups
      # Docker socket for backup operations
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      sh -c "
      apk add --no-cache tar gzip docker-cli &&
      echo 'Backup service running. Backups occur daily at 02:00 UTC' &&
      tail -f /dev/null
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - wazuh.manager
      - openldap
      - mattermost
      - phpldapadmin
    restart: unless-stopped

  # =========================================================================
  # PROMETHEUS METRIC EXPORTERS
  # =========================================================================

  # PostgreSQL Exporter for Mattermost database
  postgres-exporter-mm:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-mm
    hostname: postgres-exporter-mm
    environment:
      DATA_SOURCE_NAME: "postgresql://mmuser:Mattermost20250SecurePassword@postgres:5432/mattermost?sslmode=disable"
    # ports:
    #   - "9187:9187"
    networks:
      internal_net:
        ipv4_address: 10.10.20.110
      security_net:
        ipv4_address: 10.10.30.110
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Exporter for Multi-tenant database
  # NOTE: Disabled due to authentication issues with multitenant database
  # postgres-exporter-mt:
  #   image: prometheuscommunity/postgres-exporter:latest
  #   container_name: postgres-exporter-mt
  #   environment:
  #     DATA_SOURCE_NAME: "postgresql://postgres:lU5CoFz1O65ycZwIXU5tTU4GT0SKIyom@postgresql:5432/multitenant?sslmode=disable"
  #   ports:
  #     - "9188:9187"
  #   networks:
  #     - internal_net
  #     - security_net
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # MongoDB Exporter
  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    container_name: mongodb-exporter
    hostname: mongodb-exporter
    environment:
      MONGODB_URI: "mongodb://mongodb:27017"
    # ports:
    #   - "9216:9216"
    networks:
      internal_net:
        ipv4_address: 10.10.20.112
      security_net:
        ipv4_address: 10.10.30.112
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Node Exporter - Host system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # ports:
    #   - "9100:9100"
    networks:
      security_net:
        ipv4_address: 10.10.30.150
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # cAdvisor - Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    hostname: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # ports:
    #   - "8081:8080"
    networks:
      security_net:
        ipv4_address: 10.10.30.151
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================================
  # HONEYPOT EXPORTERS
  # =========================================================================

  # Custom Honeypot Prometheus Exporter
  honeypot-exporter:
    image: cyberlab/honeypot-exporter:latest
    container_name: honeypot-exporter
    hostname: honeypot-exporter
    volumes:
      - cowrie_logs:/var/log/cowrie:ro
      - dionaea_logs:/opt/dionaea/var:ro
      - suricata_logs:/var/log/suricata:ro
      - pcap_data:/data/pcap:ro
    # ports:
    #   - "9191:9191"
    networks:
      dmz_net:
        ipv4_address: 10.10.10.130
      security_net:
        ipv4_address: 10.10.30.130
    restart: unless-stopped
    depends_on:
      - cowrie
      - dionaea
      - suricata
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9191/metrics')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

