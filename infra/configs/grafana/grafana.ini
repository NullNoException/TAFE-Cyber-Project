#################################### General ####################################
[general]
# instance name
instance_name = CyberLab Grafana

#################################### Security ####################################
[security]
# Admin user
admin_user = admin
admin_password = SecureG@fana1

# Cookie secure - set to true when behind HTTPS reverse proxy
# Note: Set to false for development/testing without HTTPS
cookie_secure = false
cookie_samesite = Lax
cookie_httponly = false

# X-Frame-Options for security
x_frame_options = SAMEORIGIN
x_content_type_options = nosniff

# API tokens
allow_embed_frames = true

#################################### Users ####################################
[users]
# Allow signup
allow_sign_up = false

# Maximum inactive lifetime days
login_maximum_inactive_lifetime_days = 7

#################################### Anonymous Auth ####################################
[auth.anonymous]
# Enable anonymous access
enabled = true

# Default organization role
org_role = Admin

#################################### Server ####################################
[server]
# HTTP protocol
protocol = http
http_addr = 0.0.0.0
http_port = 3000

# Root URL - Let Traefik pass X-Forwarded-* headers
# Grafana will auto-detect the correct URL from reverse proxy headers
root_url = https://grafana.cyberlab.local
serve_from_sub_path = false

# Enable X-Forwarded headers support from reverse proxy
enable_xheader_user_agent_update = true
x_forwarded_proto = https

#################################### Logging ####################################
[log]
mode = console
level = info

#################################### Database ####################################
[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

#################################### Session ####################################
[session]
provider = file
provider_config = sessions

#################################### Auth Settings ####################################
[auth]
# Default organization
default_org_name = Main Org

# Default role
default_role = Admin

#################################### Anonymous Auth ####################################
[auth.anonymous]
enabled = true
org_role = Admin
