// BIND9 Configuration for CyberLab Infrastructure DNS

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    
    // Forward queries to upstream DNS servers if not found locally
    forwarders {
        8.8.8.8;
        8.8.4.4;
        1.1.1.1;
    };
    
    allow-query { any; };
    allow-query-cache { any; };
    recursion yes;
    
    dnssec-validation auto;
    auth-nxdomain no;
    
    // Disable NOTIFY messages
    notify no;
};

// Local zone for cyberlab.local
zone "cyberlab.local" {
    type master;
    file "/etc/bind/zones/db.cyberlab.local";
    allow-transfer { none; };
    allow-update { none; };
};

// Reverse DNS zones
zone "10.10.30.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.10.10.30.rev";
    allow-transfer { none; };
};

zone "10.10.40.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.10.10.40.rev";
    allow-transfer { none; };
};

zone "10.10.20.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.10.10.20.rev";
    allow-transfer { none; };
};

zone "10.10.0.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.10.10.0.rev";
    allow-transfer { none; };
};

