# =============================================================================
# Cowrie SSH/Telnet Honeypot Configuration
# =============================================================================
# This configuration creates a realistic SSH/Telnet honeypot to capture
# brute-force attacks, SSH key exchanges, and malware attempts.
# =============================================================================

[honeypot]
# The IP address that the honeypot listens on
# Use 0.0.0.0 to listen on all interfaces
listen_addr = 0.0.0.0

# Hostname for the simulated system
hostname = prodserver01

# Simulate a specific operating system
# Options: linux, ubuntu, debian, centos, freebsd, windows, etc.
system_type = Linux

# System information to display
system_version = 3.10.0-957.el7.x86_64

# =============================================================================
# SSH PROTOCOL SETTINGS
# =============================================================================
[ssh]
# Enable SSH honeypot
enabled = true

# SSH listening port
port = 2222

# SSH version string
version = OpenSSH_7.6

# Host key algorithms (list of algorithms the server supports)
host_key_algorithms = ssh-rsa

# =============================================================================
# TELNET PROTOCOL SETTINGS
# =============================================================================
[telnet]
# Enable Telnet honeypot
enabled = true

# Telnet listening port
port = 2223

# Telnet banner
banner = Welcome to prodserver01

# =============================================================================
# AUTHENTICATION SETTINGS
# =============================================================================
[authentication]
# Enable SSH key authentication
key_auth = true

# SSH host key size
host_key_size = 1024

# Accept any username/password combination for logging purposes
# All attempts will be logged
auth_all_attempts = true

# Password attempts to allow before disconnection
max_auth_attempts = 10

# Username patterns to capture
capture_patterns = root,admin,test,user,guest

# =============================================================================
# FILESYSTEM EMULATION
# =============================================================================
[filesystem]
# Enable filesystem emulation
enabled = true

# Fake file structure path
home_directory = /home/admin

# Fake root directory
root_directory = /root

# Show common Linux directories
show_etc = true
show_var = true
show_tmp = true
show_dev = true

# Files to present in the system
fake_files = /etc/shadow,/etc/passwd,/etc/hosts

# =============================================================================
# COMMAND EXECUTION LOGGING
# =============================================================================
[commands]
# Log all executed commands
log_all = true

# Capture command output
capture_output = true

# Simulate basic command responses
simulate_responses = true

# Commands to track specially
tracked_commands = ls,cat,wget,curl,python,nc,bash,sh

# =============================================================================
# PAYLOAD/MALWARE CAPTURE
# =============================================================================
[payloads]
# Enable download capture
capture_downloads = true

# Directory to store captured payloads
capture_directory = /cowrie/downloads

# Store downloaded files with metadata
store_metadata = true

# Maximum payload size to capture (in MB)
max_size = 100

# =============================================================================
# LOGGING AND OUTPUT CONFIGURATION
# =============================================================================
[output]
# JSON logging for structured log analysis
json = true

# Log format for file output
# Options: text, json, both
log_format = json

# Log directory (will be mounted as volume in Docker)
log_directory = /var/log/cowrie

# Log file names
access_log = cowrie.log
json_log = cowrie.json
error_log = cowrie.err

# Enable rotation of logs
log_rotation = true

# Log rotation size (MB)
log_size = 100

# Keep N backup logs
log_backups = 5

# =============================================================================
# ALERT AND NOTIFICATION
# =============================================================================
[alerts]
# Enable syslog output
syslog = true

# Syslog host (Wazuh Manager in docker-compose)
syslog_host = wazuh.manager

# Syslog port
syslog_port = 514

# Syslog facility (default: LOG_USER=8)
syslog_facility = 16

# Syslog level
syslog_level = info

# Alert on successful login attempts
alert_success = true

# Alert on failed login attempts
alert_failure = true

# Alert on command execution
alert_commands = true

# Alert on file downloads
alert_downloads = true

# =============================================================================
# PERFORMANCE AND LIMITS
# =============================================================================
[limits]
# Maximum concurrent connections
max_connections = 100

# Timeout for idle sessions (seconds)
idle_timeout = 600

# Maximum sessions per IP
max_sessions_per_ip = 10

# Rate limit failed logins per IP (attempts per minute)
failed_login_rate_limit = 50

# =============================================================================
# ADVANCED FEATURES
# =============================================================================
[advanced]
# Enable connection logging
log_connections = true

# Log SSH key fingerprints
log_key_fingerprints = true

# Record session replays
record_sessions = true

# Session recording directory
replay_directory = /cowrie/recordings

# Enable TTY recording for session replay
tty_recording = true

# Log connection source IP and port details
log_connection_details = true

# Honeypot identifier for logs (useful for multiple honeypots)
honeypot_id = cowrie-01

# Environment variables to log
log_environment = true

# =============================================================================
# INTERACTIVE SHELL SETTINGS
# =============================================================================
[shell]
# Enable fake shell
fake_shell = true

# Shell prompt
prompt = $ 

# Root prompt
root_prompt = # 

# Fake shell history size
history_size = 50

# Show fake shell history on login
show_history = false
