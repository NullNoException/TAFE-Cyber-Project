# =============================================================================
# Dionaea Multi-Protocol Honeypot Configuration
# =============================================================================
# Dionaea simulates multiple vulnerable services (SMB, HTTP, FTP, TFTP,
# MSSQL, MySQL) to detect and capture malware and exploitation attempts.
# =============================================================================

[core]
# Dionaea listen address
listen = 0.0.0.0

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# Honeypot name/identifier
name = dionaea-01

# Honeypot location
location = Internal Network

# =============================================================================
# SERVICE CONFIGURATION
# =============================================================================

# Enable/Disable specific services
[services]
# SMB (Samba) - Windows file sharing protocol
smb_enabled = true
smb_port = 445

# HTTP - Web server
http_enabled = true
http_port = 80
https_enabled = true
https_port = 443

# FTP - File Transfer Protocol
ftp_enabled = true
ftp_port = 21

# TFTP - Trivial File Transfer Protocol
tftp_enabled = true
tftp_port = 69

# MSSQL - Microsoft SQL Server
mssql_enabled = true
mssql_port = 1433

# MySQL - MySQL Database
mysql_enabled = true
mysql_port = 3306

# RDP - Remote Desktop Protocol
rdp_enabled = true
rdp_port = 3389

# =============================================================================
# SMB CONFIGURATION (Windows File Sharing)
# =============================================================================
[smb]
# SMB version
version = 3.1.1

# Share names to expose
shares = C$,IPC$,ADMIN$,Public

# OS emulation
os = Windows Server 2019

# Computer name
computer_name = CORPSERVER01

# Workgroup
workgroup = CYBERLAB

# =============================================================================
# HTTP/HTTPS CONFIGURATION
# =============================================================================
[http]
# HTTP Server banner
server_banner = Apache/2.4.41

# Default page content
default_page = index.html

# Simulate vulnerable application
vulnerable_app = true

# Fake application name
app_name = Admin Panel v1.0

# Enable directory listing
directory_listing = true

# HTTPS certificate
use_ssl = true

# Self-signed certificate info
ssl_cert_country = US
ssl_cert_state = CA
ssl_cert_city = San Francisco
ssl_cert_org = CyberLab

# =============================================================================
# FTP CONFIGURATION
# =============================================================================
[ftp]
# FTP Server banner
banner = Welcome to FTP Server

# Anonymous login enabled
anonymous_enabled = true

# Fake files to list
files = readme.txt,important_data.zip,backup.sql

# Home directory
home_dir = /ftp

# Passive mode
passive_mode = true

# Passive port range
passive_min_port = 40000
passive_max_port = 50000

# =============================================================================
# TFTP CONFIGURATION
# =============================================================================
[tftp]
# TFTP root directory
root_dir = /tftp

# Allow upload
upload_enabled = true

# Allow download
download_enabled = true

# Simulate vulnerable firmware files
firmware_files = true

# =============================================================================
# DATABASE CONFIGURATIONS
# =============================================================================

[mssql]
# MSSQL version
version = 2019

# Server name
server_name = MSSQL_SERVER

# Simulate login attempts capture
capture_login_attempts = true

# Fake databases
databases = master,tempdb,msdb,CustomDB

[mysql]
# MySQL version
version = 5.7.30

# Server hostname
hostname = mysql-server

# Fake databases
databases = mysql,information_schema,performance_schema,webdb

# Simulate login attempts capture
capture_login_attempts = true

# =============================================================================
# MALWARE CAPTURE SETTINGS
# =============================================================================
[malware]
# Enable malware capture
capture_enabled = true

# Directory for captured payloads
capture_directory = /dionaea/downloads

# Maximum file size to capture (MB)
max_size = 500

# Store original file
store_original = true

# Store file metadata
store_metadata = true

# Analyze with ClamAV if available
clamav_scan = true

# Store sample hashes
compute_hashes = true

# Hash algorithms: md5, sha1, sha256
hash_algorithms = md5,sha1,sha256

# =============================================================================
# INCIDENT LOGGING
# =============================================================================
[logging]
# Log format: text, json, syslog, both
log_format = json

# Log directory (mounted as volume)
log_directory = /var/log/dionaea

# Main log file
log_file = dionaea.log

# JSON log file
json_log_file = dionaea.json

# Incident log file
incident_log = incidents.log

# Log rotation
log_rotation = true

# Log size before rotation (MB)
log_size = 100

# Number of backup logs
log_backups = 10

# =============================================================================
# SYSLOG/WAZUH INTEGRATION
# =============================================================================
[syslog]
# Enable syslog output
enabled = true

# Syslog host (Wazuh Manager)
host = wazuh.manager

# Syslog port
port = 514

# Syslog facility (16 = local0)
facility = 16

# Syslog level
level = info

# Send alerts to syslog
send_alerts = true

# Include incident details
include_details = true

# =============================================================================
# CONNECTION TRACKING
# =============================================================================
[connections]
# Log all incoming connections
log_all = true

# Track connection source/destination
track_endpoints = true

# Log protocol versions
log_protocol_versions = true

# Log client information
log_client_info = true

# Maximum concurrent connections
max_connections = 200

# Connection timeout (seconds)
timeout = 3600

# =============================================================================
# ALERT THRESHOLDS
# =============================================================================
[alerts]
# Alert on suspicious commands
alert_commands = true

# Alert on file uploads
alert_uploads = true

# Alert on SQL injection attempts
alert_sql_injection = true

# Alert on buffer overflow attempts
alert_buffer_overflow = true

# Alert on exploit signatures detected
alert_exploits = true

# Alert on known malware hashes
alert_known_malware = true

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
[performance]
# Number of worker threads
worker_threads = 4

# Queue size for connection processing
queue_size = 1000

# Memory limit (MB)
memory_limit = 512

# CPU cores to use
cpu_cores = 2

# =============================================================================
# REPORTING
# =============================================================================
[reporting]
# Generate daily reports
daily_reports = true

# Report directory
report_directory = /dionaea/reports

# Include traffic statistics
include_stats = true

# Include captured payloads info
include_payloads = true

# Include connection sources
include_connections = true

# Email reports (optional)
email_reports = false
email_to = admin@cyberlab.local
