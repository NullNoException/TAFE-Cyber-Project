###############################################################################
# Prometheus Configuration - CyberLab Infrastructure Metrics Collection
###############################################################################

global:
  scrape_interval: 15s        # Default scrape interval for all targets
  evaluation_interval: 15s    # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'cyberlab'
    environment: 'lab'

# Alertmanager configuration (optional - can be enabled later)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # Uncomment when rule files are created
  # - "alert_rules.yml"
  # - "recording_rules.yml"

###############################################################################
# SCRAPE CONFIGURATIONS
###############################################################################

scrape_configs:
  # =========================================================================
  # Prometheus Self-Monitoring
  # =========================================================================
  - job_name: 'prometheus'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['localhost:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # =========================================================================
  # TRAEFIK REVERSE PROXY - METRICS
  # =========================================================================
  - job_name: 'traefik'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['traefik:8082']
        labels:
          service: 'traefik'
          layer: 'proxy'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 10s
    scrape_timeout: 5s

  # =========================================================================
  # MONITORING STACK
  # =========================================================================
  - job_name: 'grafana'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          layer: 'observability'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # =========================================================================
  # SECURITY LAYER - CONTAINER SECURITY
  # =========================================================================
  - job_name: 'neuvector'
    honor_timestamps: true
    metrics_path: '/api/prometheus'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['neuvector.allinone:8443']
        labels:
          service: 'neuvector'
          layer: 'security'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 30s

  # =========================================================================
  # WAZUH SECURITY SERVICES
  # =========================================================================
  
  # Wazuh Manager - API metrics (if exposed)
  - job_name: 'wazuh-manager'
    honor_timestamps: true
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['wazuh.manager:55000']
        labels:
          service: 'wazuh-manager'
          layer: 'security'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 30s
    scrape_timeout: 10s
    # Note: Requires authentication - may need bearer token

  # Wazuh Indexer (OpenSearch) - Cluster metrics
  - job_name: 'wazuh-indexer'
    honor_timestamps: true
    metrics_path: '/_prometheus/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: 'admin'
      password: 'SecurePassword123'
    static_configs:
      - targets: ['wazuh.indexer:9200']
        labels:
          service: 'wazuh-indexer'
          layer: 'storage'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 30s

  # =========================================================================
  # DNS SERVER
  # =========================================================================
  - job_name: 'dns-server'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['dns-server:8053']
        labels:
          service: 'dns-server'
          layer: 'infrastructure'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 30s
    # Note: Requires BIND metrics HTTP module or separate exporter

  # =========================================================================
  # IDS/IPS - NETWORK SECURITY
  # =========================================================================
  - job_name: 'suricata'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['suricata:8000']
        labels:
          service: 'suricata'
          layer: 'network-security'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    scrape_interval: 30s
    # Note: Requires Suricata stats HTTP server or separate exporter

  # =========================================================================
  # DATABASE LAYER - METRICS EXPORTERS
  # =========================================================================
  
  # PostgreSQL exporter (if deployed separately)
  # - job_name: 'postgresql'
  #   honor_timestamps: true
  #   metrics_path: '/metrics'
  #   scheme: http
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgresql'
  #         layer: 'database'
  #   scrape_interval: 30s

  # MongoDB exporter (if deployed separately)
  # - job_name: 'mongodb'
  #   honor_timestamps: true
  #   metrics_path: '/metrics'
  #   scheme: http
  #   static_configs:
  #     - targets: ['mongodb-exporter:9216']
  #       labels:
  #         service: 'mongodb'
  #         layer: 'database'
  #   scrape_interval: 30s

  # =========================================================================
  # COMMUNICATION SERVICES
  # =========================================================================
  
  # Rocket.Chat (requires metrics exporter)
  # - job_name: 'rocketchat'
  #   honor_timestamps: true
  #   metrics_path: '/metrics'
  #   scheme: http
  #   static_configs:
  #     - targets: ['rocketchat:3000']
  #       labels:
  #         service: 'rocketchat'
  #         layer: 'communication'
  #   scrape_interval: 30s

  # =========================================================================
  # INFRASTRUCTURE - SYSTEM METRICS
  # =========================================================================
  
  # Node Exporter (if deployed for host metrics)
  # - job_name: 'node'
  #   honor_timestamps: true
