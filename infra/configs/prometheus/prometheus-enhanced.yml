###############################################################################
# Prometheus Configuration - CyberLab Infrastructure (ENHANCED)
# Complete monitoring setup with all services, databases, and honeypots
###############################################################################

global:
  scrape_interval: 15s          # Default scrape interval
  evaluation_interval: 15s      # Evaluate alert rules every 15 seconds
  external_labels:
    cluster: 'cyberlab'
    environment: 'lab'
    region: 'security-lab'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load alert and recording rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'
  - '/etc/prometheus/recording-rules.yml'

###############################################################################
# SCRAPE CONFIGURATIONS - COMPLETE INFRASTRUCTURE
###############################################################################

scrape_configs:

  # =========================================================================
  # MONITORING & OBSERVABILITY STACK
  # =========================================================================

  - job_name: 'prometheus'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['localhost:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'traefik'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['traefik:8082']
        labels:
          service: 'traefik'
          layer: 'proxy'
          tier: 'infrastructure'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'grafana'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          layer: 'observability'

  - job_name: 'influxdb'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['influxdb:8086']
        labels:
          service: 'influxdb'
          layer: 'storage'
    scrape_interval: 30s

  # =========================================================================
  # SECURITY & THREAT DETECTION LAYER
  # =========================================================================

  - job_name: 'neuvector'
    honor_timestamps: true
    metrics_path: '/api/prometheus'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['neuvector-allinone:8443']
        labels:
          service: 'neuvector'
          layer: 'security'
          type: 'container-security'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'wazuh-manager'
    honor_timestamps: true
    metrics_path: '/'
    scheme: http
    static_configs:
      - targets: ['10.10.30.20:514']
        labels:
          service: 'wazuh-manager'
          layer: 'security'
          type: 'siem'
    scrape_interval: 60s
    scrape_timeout: 10s

  # =========================================================================
  # DATABASE LAYER WITH EXPORTERS
  # =========================================================================

  # PostgreSQL Exporter - Mattermost DB
  - job_name: 'postgresql-mattermost'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['postgres-exporter-mm:9187']
        labels:
          service: 'postgresql'
          database: 'mattermost'
          layer: 'database'
    scrape_interval: 30s

  # PostgreSQL Exporter - Multi-tenant DB
  - job_name: 'postgresql-multitenant'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['postgres-exporter-mt:9187']
        labels:
          service: 'postgresql'
          database: 'multitenant'
          layer: 'database'
    scrape_interval: 30s

  # MongoDB Exporter
  - job_name: 'mongodb'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: 'mongodb'
          layer: 'database'
    scrape_interval: 30s

  # MariaDB Exporter - RADIUS Database
  - job_name: 'mariadb'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['mariadb-exporter:9104']
        labels:
          service: 'mariadb'
          database: 'radius'
          layer: 'database'
    scrape_interval: 30s

  # =========================================================================
  # NETWORK & AUTHENTICATION SERVICES
  # =========================================================================

  # DNS Server (BIND9) - requires bind_exporter
  - job_name: 'dns-server'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['dns-exporter:9119']
        labels:
          service: 'dns'
          layer: 'network'
    scrape_interval: 30s

  # OpenVPN - requires openVPN_exporter or probing
  - job_name: 'openvpn'
    honor_timestamps: true
    metrics_path: '/'
    scheme: http
    static_configs:
      - targets: ['openvpn-exporter:9176']
        labels:
          service: 'openvpn'
          layer: 'network'
    scrape_interval: 30s

  # OpenLDAP - requires openldap_exporter
  - job_name: 'openldap'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['openldap-exporter:9330']
        labels:
          service: 'openldap'
          layer: 'authentication'
    scrape_interval: 30s

  # FreeRADIUS - requires radius_exporter
  - job_name: 'freeradius'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['freeradius-exporter:9812']
        labels:
          service: 'freeradius'
          layer: 'authentication'
    scrape_interval: 30s

  # =========================================================================
  # HONEYPOT SERVICES (with custom exporters)
  # =========================================================================

  - job_name: 'cowrie-honeypot'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['cowrie-exporter:9191']
        labels:
          service: 'cowrie'
          type: 'ssh-telnet-honeypot'
          layer: 'security'
    scrape_interval: 30s

  - job_name: 'dionaea-honeypot'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['dionaea-exporter:9192']
        labels:
          service: 'dionaea'
          type: 'multi-protocol-honeypot'
          layer: 'security'
    scrape_interval: 30s

  # =========================================================================
  # APPLICATION SERVICES
  # =========================================================================

  - job_name: 'mattermost'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['mattermost-exporter:9218']
        labels:
          service: 'mattermost'
          layer: 'application'
    scrape_interval: 60s

  # =========================================================================
  # SYSTEM & INFRASTRUCTURE METRICS
  # =========================================================================

  # Node Exporter - Host system metrics
  - job_name: 'node-exporter'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          layer: 'infrastructure'
    scrape_interval: 15s

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          layer: 'infrastructure'
    scrape_interval: 15s

  # Netdata - Real-time metrics (optional, already has web UI)
  - job_name: 'netdata'
    honor_timestamps: true
    metrics_path: '/api/v1/data'
    scheme: http
    static_configs:
      - targets: ['netdata:19999']
        labels:
          service: 'netdata'
          layer: 'observability'
    scrape_interval: 10s

  # =========================================================================
  # PACKET CAPTURE & NETWORK ANALYSIS
  # =========================================================================

  - job_name: 'suricata'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['suricata-exporter:9193']
        labels:
          service: 'suricata'
          type: 'ids-ips'
          layer: 'security'
    scrape_interval: 30s

  - job_name: 'tcpdump-collector'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['tcpdump-exporter:9194']
        labels:
          service: 'tcpdump'
          type: 'packet-capture'
          layer: 'network'
    scrape_interval: 30s

  # =========================================================================
  # REMOTE STORAGE CONFIGURATION (Long-term storage to InfluxDB)
  # =========================================================================

# Uncomment to enable remote write to InfluxDB for long-term retention
remote_write:
  - url: "http://influxdb:8086/api/v1/prom/write?db=prometheus"
    write_relabel_configs:
      # Keep all metrics
      - source_labels: [__name__]
        regex: '.*'
        action: keep

# Uncomment to enable remote read from InfluxDB
remote_read:
  - url: "http://influxdb:8086/api/v1/prom/read?db=prometheus"
    read_recent: true

###############################################################################
# SCRAPE PARAMETER DEFINITIONS
###############################################################################

# Scrape timeout values:
# - Short-lived services (APIs): 5s
# - Standard services: 10s
# - Long-running queries: 30s

# Scrape intervals:
# - High-frequency metrics: 10s (Traefik, reverse proxy)
# - Standard services: 15-30s (databases, security)
# - Low-frequency metrics: 60s (backup, batch jobs)

###############################################################################
# EXPORTERS REQUIRED BUT NOT YET DEPLOYED
###############################################################################

# The following exporters need to be deployed as separate containers:
#
# 1. postgres_exporter - PostgreSQL metrics
#    Image: prometheuscommunity/postgres-exporter
#    Port: 9187
#    Instances: 2 (mattermost, multitenant)
#
# 2. mongodb_exporter - MongoDB metrics
#    Image: percona/mongodb_exporter
#    Port: 9216
#
# 3. mysqld_exporter - MariaDB metrics
#    Image: prom/mysqld-exporter
#    Port: 9104
#
# 4. bind_exporter - DNS/BIND metrics
#    Image: kbudde/bind-exporter
#    Port: 9119
#
# 5. openvpn_exporter - OpenVPN metrics
#    Image: wunder/openvpn-exporter
#    Port: 9176
#
# 6. openldap_exporter - OpenLDAP metrics
#    Image: syxesacid/openldap-exporter
#    Port: 9330
#
# 7. freeradius_exporter - FreeRADIUS metrics
#    Image: custom (not available, needs development)
#    Port: 9812
#
# 8. cowrie_exporter - Cowrie honeypot metrics
#    Custom exporter from Cowrie logs
#    Port: 9191
#
# 9. dionaea_exporter - Dionaea honeypot metrics
#    Custom exporter from Dionaea logs
#    Port: 9192
#
# 10. mattermost_exporter - Mattermost metrics
#     Image: promcommunity/mattermost-exporter
#     Port: 9218
#
# 11. suricata_exporter - Suricata IDS metrics
#     Custom exporter from eve.json
#     Port: 9193
#
# 12. tcpdump_exporter - TCPDump packet stats
#     Custom exporter from tcpdump output
#     Port: 9194

