###############################################################################
# Traefik Dynamic Configuration - Simplified for Docker Services
###############################################################################

http:
  middlewares:
    # Forwarded headers middleware - properly handle X-Forwarded-* headers
    forwarded-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Port: "443"
          X-Forwarded-For: ""  # Traefik will populate this automatically
          X-Forwarded-Host: ""  # Traefik will populate this automatically

    # Security headers
    security-headers:
      headers:
        customResponseHeaders:
          X-Frame-Options: "SAMEORIGIN"
          X-Content-Type-Options: "nosniff"
          X-XSS-Protection: "1; mode=block"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains"
          X-Permitted-Cross-Domain-Policies: "none"
          Referrer-Policy: "strict-origin-when-cross-origin"
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    # Compression
    compression:
      compress: {}

    # Grafana basic auth (auto-login with admin credentials)
    grafana-basicauth:
      basicAuth:
        users:
          - "admin:$2y$05$ZtaKjFCufgvmbd9lQqEKBOtfSXN6.TX1RFO0dO1z2CsZ6sAkWsvNe"

    # Authentication for Wazuh APIs (basic auth placeholder)
    auth-wazuh:
      basicAuth:
        users:
          - "admin:$apr1$r31.....$HqJZimcKQFAMYayBlzkrA/"  # Generate with: htpasswd -c auth admin

    # Rate limiting for API endpoints
    rate-limit-api:
      rateLimit:
        average: 100
        burst: 200
        period: "1m"

    # ==========================================================================
    # NETWORK ACCESS CONTROL - IP Whitelisting for Security Services
    # ==========================================================================

    # Internal Network (10.10.20.0/24) - Protected Services
    internal-net-access:
      ipWhiteList:
        sourceRange:
          - "10.10.20.0/24"     # Internal Network
          - "10.10.30.0/24"     # Security Network
          - "10.10.40.0/24"     # Management Network
          - "127.0.0.1/32"      # Localhost (Docker)

    # Security Network (10.10.30.0/24) - Monitoring & Analysis Only
    security-net-access:
      ipWhiteList:
        sourceRange:
          - "10.10.30.0/24"     # Security Network
          - "10.10.40.0/24"     # Management Network
          - "127.0.0.1/32"      # Localhost (Docker)

    # Management Network (10.10.40.0/24) - Admin Interfaces
    management-net-access:
      ipWhiteList:
        sourceRange:
          - "10.10.40.0/24"     # Management Network
          - "127.0.0.1/32"      # Localhost (Docker)

    # Restricted: Management Network + Security Network + Internal Network
    admin-only-access:
      ipWhiteList:
        sourceRange:
          - "10.10.10.100/32"     # Workstation on DMZ
          - "10.10.20.100/32"     # Workstation on Internal
          - "10.10.30.5/32"       # Traefik (for internal routing)
          - "10.10.30.21/32"      # Wazuh Dashboard
          - "10.10.30.50/32"      # Prometheus
          - "10.10.30.60/32"      # Grafana
          - "10.10.30.100/32"     # Workstation on Security
          - "10.10.40.5/32"       # Traefik (management network)
          - "10.10.40.60/32"      # Grafana (management network)
          - "10.10.40.100/32"     # Workstation on Management
          - "127.0.0.1/32"        # Localhost (Docker)
          - "0.0.0.0/0"           # Allow All (Temporary for Testing)

    # Public Services (DMZ) - External + Internal
    public-services-access:
      ipWhiteList:
        sourceRange:
          - "10.10.0.0/24"      # External Network (VPN)
          - "10.10.10.0/24"     # DMZ Network
          - "10.10.20.0/24"     # Internal Network
          - "10.10.30.0/24"     # Security Network
          - "10.10.40.0/24"     # Management Network
          - "127.0.0.1/32"      # Localhost (Docker)

    # VPN Users Only - Access restricted to OpenVPN subnet + Management
    vpn-only-access:
      ipWhiteList:
        sourceRange:
          - "172.16.3.0/24"     # OpenVPN Clients Subnet (Default for OpenVPN AS)
          - "10.10.40.0/24"     # Management Network (Admin access)
          - "127.0.0.1/32"      # Localhost

  routers:
    # Nginx Web Server - Public Services (DMZ/Internal)
    nginx:
      rule: "Host(`web.cyberlab.local`) || Host(`www.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "nginx"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "public-services-access"

    # Traefik Dashboard - Admin Only
    traefik-dashboard:
      rule: "Host(`traefik.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "api@internal"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "admin-only-access"

    # =========================================================================
    # WAZUH SERVICES ROUTERS (via Traefik)
    # =========================================================================

    # Wazuh Dashboard Web UI
    wazuh-dashboard:
      rule: "Host(`wazuh.cyberlab.local`) || Host(`dashboard.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "wazuh-dashboard-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"

    # Wazuh Manager API
    wazuh-manager-api:
      rule: "Host(`wazuh-api.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "wazuh-manager-api-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "auth-wazuh"

    # Wazuh Indexer (OpenSearch)
    wazuh-indexer:
      rule: "Host(`indexer.cyberlab.local`) || Host(`opensearch.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "wazuh-indexer-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "auth-wazuh"
        

    # LDAP Admin Interface (phpLDAPadmin) - Internal + Security + Management Networks
    phpldapadmin:
      rule: "Host(`ldap.cyberlab.local`) || Host(`ldapadmin.cyberlab.local`) || Host(`directory.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "phpldapadmin-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "internal-net-access"

    # Suricata IDS/IPS Monitoring - Security Network + Management Network
    suricata:
      rule: "Host(`suricata.cyberlab.local`) || Host(`ids.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "suricata-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "security-net-access"

    # OpenVPN Admin Panel - Public Access
    openvpn:
      rule: "Host(`vpn.cyberlab.local`) || Host(`openvpn.cyberlab.local`) || Host(`vpn-admin.cyberlab.local`)"
      entryPoints:
        - "web"
        - "websecure"
      service: "openvpn-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"

    # Daloradius Web UI - RADIUS Management
    daloradius:
      rule: "Host(`radius.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "daloradius-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "admin-only-access"

    # DNS Server Console - Management Network Only (NO localhost/external access)
    dns-console:
      rule: "Host(`dns.cyberlab.local`) || Host(`dns-console.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "dns-console-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "management-net-access"

    # Workstation Desktop - VPN Users Only + Management
    workstation:
      rule: "Host(`workstation.cyberlab.local`) || Host(`desktop.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "workstation-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "vpn-only-access"

    # =========================================================================
    # MONITORING & OBSERVABILITY
    # =========================================================================

    # Prometheus - Metrics Collection (Admin Only)
    prometheus:
      rule: "Host(`prometheus.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "prometheus-svc"
      tls: {}
      middlewares:
        - "forwarded-headers"
        - "security-headers"
        - "compression"
        - "admin-only-access"

    # Grafana - Visualization & Dashboarding (No Restrictions)
    grafana:
      rule: "Host(`grafana.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "grafana-svc"
      tls: {}
      middlewares:
        - "forwarded-headers"
        - "security-headers"
        - "compression"

    # =========================================================================
    # HONEYPOT SERVICES - INTERNAL NETWORK ONLY
    # =========================================================================

    # Cowrie SSH/Telnet Honeypot - No web UI, routing via TCP only
    # Access via SSH: ssh -p 2222 user@cowrie.cyberlab.local
    # Access via Telnet: telnet cowrie.cyberlab.local 2223
    
    # Dionaea Multi-Protocol Honeypot - No web UI dashboard
    # Access via FTP: ftp dionaea.cyberlab.local
    # Access via SMB: smbclient //dionaea.cyberlab.local/share
    # Access via MySQL: mysql -h dionaea.cyberlab.local -P 3306
    
    # NOTE: Honeypots are routed via TCP entry points in the tcp section below
    # HTTP routers removed as honeypots do not provide web dashboards

    # =========================================================================
    # WEB APPLICATION HONEYPOTS - OWASP VULNERABLE APPLICATIONS
    # =========================================================================

    # OWASP Juice Shop - Vulnerable E-commerce Application
    juice-shop:
      rule: "Host(`juice-shop.cyberlab.local`) || Host(`juice.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "juice-shop-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "internal-net-access"

    # OWASP WebGoat - Web Application Security Training
    webgoat:
      rule: "Host(`webgoat.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "webgoat-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "internal-net-access"

    # =========================================================================
    # PACKET CAPTURE & NETWORK ANALYSIS
    # =========================================================================

    # Wireshark Web UI - Packet Analysis
    wireshark:
      rule: "Host(`wireshark.cyberlab.local`) || Host(`pcap.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "wireshark-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "security-net-access"

    # =========================================================================
    # REAL-TIME MONITORING & OBSERVABILITY WEB UIs
    # =========================================================================

    # Netdata - Real-time System & Network Monitoring
    netdata:
      rule: "Host(`netdata.cyberlab.local`) || Host(`monitoring.cyberlab.local`) || Host(`realtime.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "netdata-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "security-net-access"

    # InfluxDB - Time Series Database Admin UI
    influxdb:
      rule: "Host(`influxdb.cyberlab.local`) || Host(`timeseries.cyberlab.local`)"
      entryPoints:
        - "websecure"
      service: "influxdb-svc"
      tls: {}
      middlewares:
        - "security-headers"
        - "compression"
        - "security-net-access"

  services:
    nginx:
      loadBalancer:
        servers:
          - url: "http://nginx:80"

    # =========================================================================
    # WAZUH SERVICES
    # =========================================================================

    wazuh-dashboard-svc:
      loadBalancer:
        servers:
          - url: "https://wazuh.dashboard:5601"
        serversTransport: "wazuh-transport"

    wazuh-manager-api-svc:
      loadBalancer:
        servers:
          - url: "https://wazuh.manager:55000"
        serversTransport: "wazuh-manager-transport"

    wazuh-indexer-svc:
      loadBalancer:
        servers:
          - url: "https://wazuh.indexer:9200"
        serversTransport: "wazuh-indexer-transport"

    phpldapadmin-svc:
      loadBalancer:
        servers:
          - url: "http://phpldapadmin:80"

    suricata-svc:
      loadBalancer:
        servers:
          - url: "http://suricata"

    openvpn-svc:
      loadBalancer:
        servers:
          - url: "https://openvpn:943"
        serversTransport: "openvpn-transport"

    daloradius-svc:
      loadBalancer:
        servers:
          - url: "http://daloradius:80"

    dns-console-svc:
      loadBalancer:
        servers:
          - url: "http://dns-server:5380"

    mattermost-svc:
      loadBalancer:
        servers:
          - url: "http://mattermost:8065"

    workstation-svc:
      loadBalancer:
        servers:
          - url: "http://workstation:80"

    # =========================================================================
    # MONITORING & OBSERVABILITY SERVICES
    # =========================================================================

    prometheus-svc:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

    grafana-svc:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    # =========================================================================
    # WEB APPLICATION HONEYPOT SERVICES
    # =========================================================================

    juice-shop-svc:
      loadBalancer:
        servers:
          - url: "http://juice-shop:3000"

    webgoat-svc:
      loadBalancer:
        servers:
          - url: "http://webgoat:8080"

    # =========================================================================
    # PACKET CAPTURE & NETWORK ANALYSIS SERVICES
    # =========================================================================

    wireshark-svc:
      loadBalancer:
        servers:
          - url: "http://wireshark-ui:3000"

    # =========================================================================
    # REAL-TIME MONITORING & OBSERVABILITY SERVICES
    # =========================================================================

    netdata-svc:
      loadBalancer:
        servers:
          - url: "http://netdata:19999"

    influxdb-svc:
      loadBalancer:
        servers:
          - url: "http://influxdb:8086"

  serversTransports:
      # Server transport for OpenVPN Access Server
      openvpn-transport:
        serverName: "openvpn"
        insecureSkipVerify: true  # Lab environment: OpenVPN uses self-signed certs
      wazuh-transport:
        # ServerName for the Wazuh Dashboard backend certificate (CN: wazuh.dashboard)
        serverName: "wazuh.dashboard"
        insecureSkipVerify: true
        # rootCAs:
        #   - /etc/traefik/certs/root-ca.pem
      # Wazuh manager (API) transport to validate the manager certificate
      wazuh-manager-transport:
        serverName: "wazuh.manager"
        insecureSkipVerify: true
        # rootCAs:
        #   - /etc/traefik/certs/root-ca.pem
        
      # Wazuh indexer transport
      wazuh-indexer-transport:
        serverName: "wazuh.indexer"
        insecureSkipVerify: true
        # rootCAs:
        #   - /etc/traefik/certs/root-ca.pem

tls:
  options:
    default:
      minVersion: "VersionTLS12"
      cipherSuites:
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
        - "TLS_AES_128_GCM_SHA256"
        - "TLS_AES_256_GCM_SHA384"
        - "TLS_CHACHA20_POLY1305_SHA256"
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: false  # Disabled to allow default certificate fallback in lab
      # preferServerCipherSuites deprecated: explicit preferServerCipherSuites removed

    intermediate:
      minVersion: "VersionTLS11"

# =============================================================================
# TCP ROUTERS - Non-HTTP Protocol Routing for Honeypots
# =============================================================================

tcp:
  routers:
    # Cowrie SSH Honeypot
    cowrie-ssh:
      entryPoints:
        - "cowrie-ssh"
      rule: "HostSNI(`*`)"
      service: "cowrie-ssh-svc"

    # Cowrie Telnet Honeypot
    cowrie-telnet:
      entryPoints:
        - "cowrie-telnet"
      rule: "HostSNI(`*`)"
      service: "cowrie-telnet-svc"

    # Dionaea FTP
    dionaea-ftp:
      entryPoints:
        - "dionaea-ftp"
      rule: "HostSNI(`*`)"
      service: "dionaea-ftp-svc"

    # Dionaea SMB/Samba
    dionaea-smb:
      entryPoints:
        - "dionaea-smb"
      rule: "HostSNI(`*`)"
      service: "dionaea-smb-svc"

    # Dionaea MSSQL
    dionaea-mssql:
      entryPoints:
        - "dionaea-mssql"
      rule: "HostSNI(`*`)"
      service: "dionaea-mssql-svc"

    # Dionaea MySQL
    dionaea-mysql:
      entryPoints:
        - "dionaea-mysql"
      rule: "HostSNI(`*`)"
      service: "dionaea-mysql-svc"

    # Dionaea RDP
    dionaea-rdp:
      entryPoints:
        - "dionaea-rdp"
      rule: "HostSNI(`*`)"
      service: "dionaea-rdp-svc"

  services:
    cowrie-ssh-svc:
      loadBalancer:
        servers:
          - address: "cowrie:2222"

    cowrie-telnet-svc:
      loadBalancer:
        servers:
          - address: "cowrie:2223"

    dionaea-ftp-svc:
      loadBalancer:
        servers:
          - address: "dionaea:21"

    dionaea-smb-svc:
      loadBalancer:
        servers:
          - address: "dionaea:445"

    dionaea-mssql-svc:
      loadBalancer:
        servers:
          - address: "dionaea:1433"

    dionaea-mysql-svc:
      loadBalancer:
        servers:
          - address: "dionaea:3306"

    dionaea-rdp-svc:
      loadBalancer:
        servers:
          - address: "dionaea:3389"
